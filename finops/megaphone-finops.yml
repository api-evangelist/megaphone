  - order
principles:
- name: Visibility
  description: Track subscription tier plus download and ad-impression volume per podcast and campaign using the Metrics and Impressions Export Services.
- name: Allocation
  description: Map networks, podcasts, and organizations to internal teams/shows so hosting and ad spend attribute correctly.
- name: Optimization
  description: Right-size the plan tier to show count and download volume; monetize inventory via the Spotify Audience Network to offset platform cost.
- name: Accountability
  description: Assign owners per network/organization and review monthly subscription plus monetization revenue against download and impression trends.
