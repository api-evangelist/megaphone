  unit: months
  aggregation: sum
  dimensions:
  - account
  - plan
- name: episode_downloads
  description: Episode downloads served through Megaphone hosting and distribution.
  unit: downloads
  aggregation: sum
  dimensions:
  - account
  - podcast
  - episode
- name: ad_impressions
