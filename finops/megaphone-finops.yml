description: >-
  FinOps view of Megaphone spend. Megaphone by Spotify bills as a subscription
  podcast-hosting and ad-monetization platform rather than a per-request API. The
  dominant cost drivers are the plan subscription (Professional from $99/month;
  Enterprise contact-sales) and the underlying hosting/distribution and dynamic
  ad-insertion volume tied to episode downloads and ad impressions. On the
  revenue side, monetization via the Spotify Audience Network offsets platform
  cost. The API carries no separate line item; it is included with the account.
notes: >-
  Per-download and per-impression economics and any monetization price floor are
  not publicly itemized and are quote-driven at the Enterprise tier; verify with
  Megaphone during reconciliation. FOCUS mapping here is a best-effort model for a
  subscription-plus-usage media platform.
