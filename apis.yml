- aid: megaphone:megaphone-direct-sales-api-v2-api
  name: Megaphone Direct Sales API v2 API
  description: >-
    **⚠️ AVAILABILITY ⚠️**


    The Direct Sales API v2 provides enhanced endpoints for managing advertisers, campaigns, orders, assets,
    and advertisements for Standard and Priority campaign types.


    **Base URL:** `https://cms.megaphone.fm/api/v2`


    **Available From:** April 15, 2026 10:00:00 AM EST


    **Migration Timeline:**


    - **Before April 15, 2026:** v2 endpoints not yet available - use legacy endpoints


    - **April 15 - July 14, 2026:** Both legacy and v2 endpoints work - migration period


    - **After July 14, 2026:** Legacy endpoints removed


    **Pagination Note (v2 Direct Sales)**


    Paginated v2 list endpoints (advertisers, campaigns, orders, advertisements, assets, and geo targeting)
    cap `per_page` at **50** (not 500 as stated in the global section) and follow the global pagination
    convention (see the Pagination section above) with two additional exceptions:


    - `X-Total` is **not** returned.


    - The `Link` header does **not** include a `last` rel.


    `X-Page`, `X-Per-Page`, and `Link` (`first`, `next`, `previous`) are returned as documented.


    Episode Topics and Audience Interests return all records in a single response and do not support pagination.
  humanURL: https://developers.megaphone.fm/
  baseURL: https://cms.megaphone.fm/api
