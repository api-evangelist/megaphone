- aid: megaphone:megaphone-sponsorships-api
  name: Megaphone Sponsorships API
  description: >-
    **⚠️ AVAILABILITY NOTICE ⚠️**


    These Sponsorship API endpoints will be available starting in late April.


    The Sponsorship API provides endpoints for managing sponsorships and sponsors, and for viewing bookable
    cuepoints for podcast episodes.


    **Base URL:** `https://cms.megaphone.fm/api/v2`


    ## Overview


    **Standard Sponsorships**: Media file inserted. Can target multiple locations.


    **Embedded Sponsorships**: Content already baked into episode audio. Created via [Create Embedded
    Sponsorship](#embedded-sponsorships-collection-create-an-embedded-sponsorship).


    **Ending a Sponsorship**: Set `endDate` or `status: "archived"` via Update. For embedded sponsorships,
    this stitches content out and frees the cuepoint. Deleting the embedded cuepoint puts the sponsorship
    in `inactive` status and the original content plays, but analytics will not be tracked.


    **Note:** Existing Megaphone baked-in annotations will become Embedded Sponsorships without retroactive
    analytics.
  humanURL: https://developers.megaphone.fm/
  baseURL: https://cms.megaphone.fm/api
  tags:
  - Sponsorships
  properties:
  - type: OpenAPI
    url: openapi/megaphone-sponsorships-api-openapi.yml
  - type: Documentation
