- aid: megaphone:megaphone-search-endpoints-api
  name: Megaphone Search Endpoints API
  description: >-
    # Search


    Megaphone provides a top-level search endpoint for various objects in our database. By default, these
    endpoints will return every instance of the object accessible to the requesting user. Adding query
    params to the url will scope the response but an array will always be returned.


    **Note:** For all search endpoints, the `filterMax` parameter may be passed with or without a time
    value. When there is no time value or when the time value is 0 (e.g. `2022-04-15` or `2022-04-15T00:00:00.0Z`),
    `filterMax` will be rounded up to the end of the day, such that all values from that day are included.
  humanURL: https://developers.megaphone.fm/
  baseURL: https://cms.megaphone.fm/api
