name: Megaphone
kind: company
description: Megaphone (Megaphone by Spotify) is an enterprise podcast hosting,
  distribution, and advertising-monetization platform, owned by Spotify since its
  2020 acquisition. Its REST API (base https://cms.megaphone.fm/api) lets podcast
  producers and partners programmatically manage networks, podcasts, and episodes,
  run dynamic ad insertion, and operate direct-sales advertising - campaigns,
  orders, advertisements, advertisers, and targeting - plus pull metrics and
  impressions via export services. API documentation is public, but an API token
  requires a paid Megaphone account (Professional from $99/month, or Enterprise).
