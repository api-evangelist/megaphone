      parameters:
      - name: organizationId
        in: query
        required: false
        schema:
          type: string
        example: 3ea516ea-a2d1-11e6-8e62-83147939747c
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
