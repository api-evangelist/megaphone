    delete:
      tags:
      - Episodes
      summary: Delete an Episode
      description: Remove an episode from the Megaphone platform.
      operationId: deleteAnEpisode
      parameters:
      - name: network_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the Network in the form of a UUID
        example: 731851fc-9fad-11e6-a338-072240a555ac
      - name: podcast_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the Podcast in the form of a UUID
        example: 731851fc-9fad-11e6-a338-072240a555ac
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the Episode in the form of the a UUID
        example: 731851fc-9fad-11e6-a338-072240a555ac
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: string
              example:
                success: Episode with id 731851fc-9fad-11e6-a338-072240a555ac successfully destroyed
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '422':
          $ref: '#/components/responses/422'
        '404':
          $ref: '#/components/responses/404'
components:
  responses:
    '403':
      description: The token's organization does not have API access, or the user lacks permission for this resource.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: string
                example:
                - Forbidden
    '401':
      description: Authentication failed. The `Authorization` header is missing or the token is invalid.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: string
                example:
                - Access denied
    '429':
      description: Rate limit exceeded. The API is limited to 60 requests per minute.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: string
                example:
                - Rate limit exceeded
    '404':
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: string
                example:
                - Not found
    '422':
      description: Validation failed. The request body contains invalid or missing fields.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
                example:
                  title:
                  - can't be blank
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: Authorization
      description: A Megaphone API token, sent as `Token token="<your-token>"`.
    ServiceAuthJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Spotify service-auth JWT. Internal callers only.
