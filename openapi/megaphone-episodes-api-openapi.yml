paths:
  /api/networks/{network_id}/podcasts/{podcast_id}/episodes:
    get:
      tags:
      - Episodes
      summary: List All Episodes
      description: Returns metadata about all the episodes you are authorized to access in the Megaphone platform.
      operationId: listAllEpisodes
      parameters:
      - name: network_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the Network in the form of a UUID
        example: 731851fc-9fad-11e6-a338-072240a555ac
      - name: podcast_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the Podcast in the form of a UUID
        example: 731851fc-9fad-11e6-a338-072240a555ac
      - name: draft
        in: query
        required: false
        schema:
          type: boolean
        description: Optional query param that can scope response to only draft or only non-draft episodes. The absence of the `draft` parameter returns all episodes.
        example: 'false'
      - name: externalId
        in: query
        required: false
        schema:
          type: string
        description: Optional query param that can scope response to only episodes with a given `externalId` value.
        example: 123abc
      - name: updated_since
        in: query
        required: false
        schema:
          type: string
        description: Optional query param that will scope the response to only episodes that have been updated since the Date and Time that is provided.
        example: 2019-11-22T19:44:09+0000
