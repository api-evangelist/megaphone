    ### GeotargetInclusions

    Geographic targeting inclusions for orders. Exclusions are only supported within the country of inclusions. The country of inclusions cannot be modified once set.

    To remove geographic inclusion targeting, send an empty object ({}). Once removed, the order can deliver in any available markets and the country cannot be re-set — to target a different country, create a new order.

    For granular inclusions targeting, countryCode does not need to be provided.
    Geoname IDs and country codes available through existing geotargeting endpoints.

    **Note:** On write, country is specified as `countryCode` (string). On read, it is returned as `countryCodes` (array of strings).

    | attribute     | type          | example                  | description                                                                                                                                                                                                   |
    | ------------- | ------------- | ------------------------ | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
    | countryCode   | string        | US                       | Two-letter ISO 3166-1 alpha-2 country code. Optional. Write: `countryCode` (string). Read: returned as `countryCodes` (array[string]) to support [Old] Standard orders which may have multiple countries set. |
    | dmaIds        | array[string] | ["501", "803"]           | Geoname DMA IDs (US only). Max 1000 across all four types                                                                                                                                                     |
    | regionIds     | array[string] | ["5128581", "5332921"]   | Geoname region IDs. Max 1000 across all types                                                                                                                                                                 |
    | postalCodeIds | array[string] | ["US:73170", "US:10001"] | Postal code IDs in format "COUNTRY:CODE". Max 1000 across all types                                                                                                                                           |
    | cityIds       | array[string] | ["5128581", "4930956"]   | City geoname IDs. Max 1000 across all types                                                                                                                                                                   |

