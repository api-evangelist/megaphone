    ### Cuepoint

    | attribute    | type    | example                                         | description                                                                                                                                                                                                                   |
    | ------------ | ------- | ----------------------------------------------- | ----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
    | id           | string  | fb748be0-373d-11ee-a14a-a3c35c166f0f            | Megaphone's unique identifier for this cuepoint.                                                                                                                                                                              |
    | title        | string  | "First midroll break"                           | Optional field to store human readable name for this cuepoint.                                                                                                                                                                |
    | cuepointType | string  | preroll                                         | The type of cuepoint. Valid values: `preroll`, `midroll`, `postroll`, `remove`, `sponsorship` (required)                                                                                                                  |
    | adCount      | number  | 3                                               | Number of ad positions in the ad location. Not applicable for `sponsorship` type.                                                                                                                                             |
    | startTime    | float   | 90.5                                            | Start time (in seconds) to start the cuepoint (required if offset not specified)                                                                                                                                              |
    | endTime      | float   | 120.5                                           | End time (in seconds). Required for `replace`/`remove` actions.                                                                                                                                                               |
    | adSources    | array   | ["auto", "auto", "auto"]                        | DEPRECATED: Ad source selection is no longer supported. All provided ad sources will be converted to "auto"                                                                                                                   |
    | action       | string  | "insert"                                        | The cuepoint action. Valid values: `insert`, `replace`, `remove` (required). Not applicable for `sponsorship` type.                                                                                                         |
    | isActive     | boolean | true                                            | Is the marker in an active state and used. Valid values: `true`, `false` (required). Note: A maximum of 5 pre-rolls, 5 post-rolls and 5 cuepoints per mid-roll (and no more than 5 mid-roll breaks) are allowed at any one time. |
    | offset       | float   | 10.5                                            | Time (in seconds) before the end of the episode audio that a postroll should be placed. If present, cuepointType must be ‘postroll’, action must be ‘insert’ and 'startTime' must not be present.                             |
    | minDuration  | float   | 10.5                                            | DEPRECATED: This field is no longer supported and will be removed soon                                                                                                                                                        |
    | maxDuration  | float   | 10.5                                            | DEPRECATED: This field is no longer supported and will be removed soon                                                                                                                                                        |
    | notes        | string  | "This midroll break should not contain promos." | Optional field to store notes about this cuepoint.                                                                                                                                                                            |

    **Sponsorship Cuepoints (`cuepointType: "sponsorship"`):**

    - `startTime` required (must be after 30 seconds into the episode)

    - Fields `adCount`, `adSources`, `action`, and `offset` are not applicable

