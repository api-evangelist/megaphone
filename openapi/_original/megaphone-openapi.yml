    ### Sponsorship

    **⚠️ AVAILABILITY NOTICE ⚠️**

    These endpoints will be available starting late **April 2026**.

    | attribute | type             | example                                                                    | description                                                         |
    | --------- | ---------------- | -------------------------------------------------------------------------- | ------------------------------------------------------------------- |
    | id        | string           | 8d4f2b1a-c3e5-4a7b-9f2d-1e6a8b3c5d7f                                       | Unique identifier                                                   |
    | name      | string           | Q2 Brand Partnership                                                       | Name of the sponsorship                                             |
    | startDate | string (ISO8601) | 2026-05-01T00:00:00.000Z                                                   | Start date                                                          |
    | endDate   | string (ISO8601) | 2026-06-30T23:59:59.000Z                                                   | End date (optional)                                                 |
    | type      | enum             | standard                                                                   | `standard` or `embedded`                                            |
    | status    | enum             | active                                                                     | `draft`, `scheduled`, `active`, `inactive`, `completed`, `archived` |
    | duration  | number           | 30                                                                         | Duration in seconds                                                 |
    | mediaUrl  | string           | [https://example.com/sponsorship.mp3](https://example.com/sponsorship.mp3) | Signed media URL (null for embedded)                                |
    | showUri   | string           | spotify:show:abc123                                                        | Spotify URI of the show                                             |
    | sponsorId | string           | 7a3b9c2d-e4f5-6a7b-8c9d-0e1f2a3b4c5d                                       | Sponsor identifier                                                  |
    | advertiserCategory | string | ADV-1-8 | Advertiser category (available through [advertiser categories endpoint](#tag/advertiser-categories/GET/api/targeting/categories)) |
    | createdAt | string (ISO8601) | 2026-04-22T10:30:00.000Z                                                   | Creation timestamp                                                  |
    | updatedAt | string (ISO8601) | 2026-04-22T10:30:00.000Z                                                   | Last updated timestamp                                              |

    **Types:** `standard` (media file inserted into episode by Megaphone) | `embedded` (content baked into episode audio)

    **Statuses:** `draft` (not yet scheduled) | `scheduled` (future start, has targets) | `active` (running, has targets) | `inactive` (0 targets) | `completed` (past end date, locked) | `archived` (user-archived, locked, non-reversible)

    **Editable Fields:** Only `name`, `endDate`, `targets`, and `advertiserCategory` can be updated. Set `status: "archived"` to archive.

    **Booking Rules:**

    - 1 Sponsorship per Cuepoint per date range

    - Max 2 Sponsorships per Episode per date range

    - Embedded Sponsorships can only target 1 Episode

    - No cuepoints in first 30000ms

    ### Target

    A target associates a sponsorship with a specific cuepoint on an episode.

    | attribute     | type   | example                              | description                                       |
    | ------------- | ------ | ------------------------------------ | ------------------------------------------------- |
    | sponsorshipId | string | 8d4f2b1a-c3e5-4a7b-9f2d-1e6a8b3c5d7f | Megaphone's identifier for the parent sponsorship |
    | cuepointId    | string | fb748be0-373d-11ee-a14a-a3c35c166f0f | Megaphone's identifier for the cuepoint           |
    | episodeUri    | string | spotify:episode:xyz789               | Spotify URI of the episode this target is on      |

    **Rules:**

    - Targets must be unique by Sponsorship ID, Cuepoint ID and date range of the Sponsorship

    - The same Cuepoint cannot have multiple Sponsorships in it for a given date (based on start_date and end_date of Sponsorship)

    ### Sponsor

    A sponsor represents the brand or company associated with sponsorships.

    | attribute | type   | example                              | description                                    |
    | --------- | ------ | ------------------------------------ | ---------------------------------------------- |
    | id        | string | 7a3b9c2d-e4f5-6a7b-8c9d-0e1f2a3b4c5d | Megaphone's unique identifier for this sponsor |
    | name      | string | Acme Corporation                     | Name of the sponsor                            |

    **Rules:**

    - Sponsors must be unique by name

    - Sponsors cannot be deleted if they have Sponsorships attached to them
