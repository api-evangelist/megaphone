info:
  title: Megaphone API
  version: 1.0.0
  description: |
    The Megaphone API ([https://cms.megaphone.fm/api](https://cms.megaphone.fm/api)) allows podcast producers and partners to view, create, update, and delete podcasts and episodes.

    Note that the Megaphone API is rate limited at 60 requests per minute (1 request per second).

    ## Direct Sales API Breaking Change Notice

    ⚠️ **IMPORTANT** ⚠️

    The legacy Direct Sales endpoints for Advertisers, Campaigns, Orders, Advertisements and Geos are being replaced with new v2 endpoints with enhanced functionality.

    ### Timeline

    **Phase 1: Before April 15, 2026**

    - Only legacy endpoints are available

    - Continue using existing Direct Sales API endpoints

    **Phase 2: April 15, 2026 10:00:00 AM EST - July 14, 2026 11:59:59 UTC (Migration Period)**

    - **v2 endpoints become available**

    - Legacy endpoints continue to work during this period

    - Both legacy and v2 endpoints are operational

    - **We strongly encourage you to start testing and migrating to v2 endpoints as soon as they become available to ensure a smooth transition before the sunset date and to continue ad delivery without disruption.**

    **Phase 3: After July 14, 2026 11:59:59 UTC**

    - Legacy endpoints are **removed and will stop working**

    - Only v2 endpoints will be supported

    - [Old] Standard campaigns can use v2 GET endpoints

    ### What's Changing

    **API Version:** v2 REST API for managing advertisers, campaigns, orders, assets, advertisements, and targeting.

    **Effective Date:** New endpoints (v2) will be effective on **April 15, 2026 10:00:00 AM EST**

    **Sunset Date:** Legacy endpoints stop for [Old] Standard on **July 14, 2026 11:59:59 UTC**

    ##### Capability Matrix

    API endpoint availability by resource, campaign type, and version

    | Resource           | Campaign Type       | GET (v2) | POST / PATCH (v2) | DELETE (v2) | Legacy POST / PUT / GET / DELETE |
    | ------------------ | ------------------- | :------: | :---------------: | :---------: | :------------------------------: |
    | Advertisers        | N/A                 | ✅        | ✅                 | ✅           | ✅                                |
    | Campaigns          | Standard / Priority | ✅        | ✅ (Archive)†      | ❌           | ❌                                |
    | Campaigns          | [Old] Standard*     | ✅        | ❌                 | ❌           | ✅                                |
    | Orders             | Standard / Priority | ✅        | ✅ (Archive)†      | ❌           | ❌                                |
    | Orders             | [Old] Standard      | ✅        | ❌                 | ❌           | ✅                                |
    | Advertisements     | Standard / Priority | ✅        | ✅ (Archive)†      | ❌           | ❌                                |
    | Advertisements     | [Old] Standard      | ✅        | ❌                 | ❌           | ✅                                |
    | Assets**           | Standard / Priority | ✅        | ✅                 | ❌           | ❌                                |
    | Geo Targeting***   | Standard / Priority | ✅        | N/A               | N/A         | ❌                                |
    | Episode Topics     | Standard / Priority | ✅        | N/A               | N/A         | ❌                                |
    | Audience Interests | Standard / Priority | ✅        | N/A               | N/A         | ❌                                |

    *"[Old] Standard" refers to campaigns that will end after the sunset date

    **Assets to be used for Standard/Priority campaigns

    ***Geo Targeting includes Countries, Regions, DMAs, Cities, and Postal Codes lookup endpoints. Not applicable to [Old] Standard campaigns. [Old] Standard campaign orders can continue to use the legacy geo endpoints below.

    †v2 uses PATCH with `status: "archived"` instead of DELETE for Campaigns, Orders, and Advertisements. See migration guide for details.

    ### Migration Guide

    **For New Integrations:**

    - If starting integration before April 15, 2026 - Use legacy endpoints, then migrate to v2 between April 15, 2026 and July 14, 2026

    - If starting integration on or after April 15, 2026 - Use v2 endpoints from the start

    **For Existing Integrations:**

    - You have until **July 14, 2026 11:59:59 UTC** to migrate to v2

    - Test v2 endpoints starting April 15, 2026

    - Complete migration before the July 14, 2026 sunset date

    **Legacy Endpoint Availability:**

    - **All legacy POST/PUT/GET/DELETE endpoints will stop working on July 14, 2026 11:59:59 UTC**

    - After July 14, 2026, all resources must use v2 endpoints

    - Both legacy and v2 endpoints work during the migration period (April 15 - July 14, 2026)

    **Documentation:**

    - See the [Direct Sales API v2](#reference/direct-sales-api-v2) section below for complete v2 endpoint documentation

    - Legacy endpoint documentation remains below for reference during the migration period

    ## Promos API v2 Breaking Change Notice

    ⚠️ **IMPORTANT** ⚠️

    The legacy Promo endpoints for Promos, Promo Advertisements, and Promo Assets are being replaced with new v2 endpoints with enhanced functionality.

    ### Timeline

    **Phase 1: Before May 15, 2026**

    - Only legacy promo endpoints are available.

    - Continue using existing Promo API endpoints.

    **Phase 2: May 15, 2026 10:00:00 EST - July 14, 2026 11:59:59 UTC (Migration Period)**

    - **v2 promo endpoints become available for promo pre-booking.**

    - Legacy promo endpoints continue to work during this period.

    - Both legacy endpoints and v2 promo endpoints are operational.

    - New promo creation through v2 requires `schedule.startAt` on or after **July 15, 2026 UTC**.

    - **We strongly encourage you to start testing and migrating to v2 promo endpoints as soon as they become available to ensure a smooth transition before the sunset date and to continue promo delivery without disruption.**

    **Phase 3: After July 14, 2026 11:59:59 UTC**

    - Legacy promo endpoints are **removed and will stop working**.

    - Only v2 promo endpoints will be supported.

    ### What's Changing

    - **API Version:** v2 REST API for managing promos, promo advertisements & assets.

    - **Effective Date:** New endpoints (v2) will be effective on **May 15, 2026 10:00:00 AM EST**.

    - **Sunset Date:** Legacy promo endpoints stop on **July 14, 2026 11:59:59 UTC**.

    ##### Capability Matrix

    API endpoint availability by resource, backing system, and version

    | Resource             | Backing System | GET (v2) | POST / PATCH (v2) | DELETE (v2) | Legacy POST / PUT / GET / DELETE |
    | -------------------- | -------------- | :------: | :---------------: | :---------: | :------------------------------: |
    | Promos               | v2             | ✅        | ✅ (Archive)†      | ❌           | ❌                                |
    | Promos               | legacy*        | ✅        | ❌                 | ❌           | ✅                                |
    | Promo Advertisements | v2             | ✅        | ✅ (Archive)†      | ❌           | ❌                                |
    | Promo Advertisements | legacy         | ❌        | ❌                 | ❌           | ✅                                |
    | Promo Assets**       | v2             | ✅        | ✅ (Archive)†      | ❌           | ❌                                |
    | Promo Assets         | legacy         | ❌        | ❌                 | ❌           | ✅                                |

    *"legacy" refers to existing promo endpoints that remain available during the migration period

    **Assets to be used for v2 promos

    †v2 uses PATCH with `status: "archived"` instead of DELETE for Promos, Promo Advertisements, and Promo Assets. See migration guide for details.

    ### Migration Guide

    #### For New Integrations

    - If starting integration before May 15, 2026, use legacy promo endpoints, then migrate to v2 between May 15, 2026 and July 14, 2026.

    - If starting integration on or after May 15, 2026, use v2 promo endpoints from the start.

    #### For Existing Integrations

    - You have until **July 14, 2026 11:59:59 UTC** to migrate to v2.

    - Test v2 promo endpoints starting May 15, 2026.

    - Complete migration before the July 14, 2026 sunset date.

    #### Legacy Endpoint Availability

    - **All legacy promo POST/PUT/GET/DELETE endpoints will stop working on July 14, 2026 11:59:59 UTC.**

    - After July 14, 2026, all promo resources must use v2 endpoints.

    - Both legacy endpoints and v2 promo endpoints work during the migration period (May 15 - July 14, 2026).

    #### Documentation

    - See the [Promo API v2](#reference/promo-api-v2) section below for complete v2 endpoint documentation.

    - Legacy promo endpoint documentation remains below for reference during the migration period.

    ## Authorization

    Use the Megaphone platform to generate authorization tokens for this API. To access the token generator, log in to Megaphone, hover over your initials in the lower-left corner, and select "Settings". Click "Generate New Token". You may create multiple tokens and delete tokens if they are no longer used.

    You must pass your generated token along with each request to the Megaphone API by using the http `Authorization` header with your generated token in the following format: `Token token="myGeneratedToken"`.

    ## Pagination

    Endpoints that may return large collections implement pagination following the proposed [RFC-5988](https://tools.ietf.org/html/rfc5988) standard for Web linking.

    You will not be able to access the whole collection in one response. Instead, you must make multiple requests to page through the collection using the links and metadata provided in the http response header.

    The following headers will be added to a response that has been paginated:

    ```
    Link: Links for navigating the pagination (first, last, next, previous)
    X-Page: Current page number
    X-Per-Page: Items per page
    X-Total: Total collection size
    ```

    Example Link header contents:

    ```
    <https://cms.megaphone.fm/api/networks/b747d182-1a54-11e7-ad32-3f1f4d195638/podcasts/b806f3fa-1a54-11e7-ad32-1382d7625b09/episodes?page=8&per_page=1>; rel="last", <https://cms.megaphone.fm/api/networks/b747d182-1a54-11e7-ad32-3f1f4d195638/podcasts/b806f3fa-1a54-11e7-ad32-1382d7625b09/episodes?page=2&per_page=1>; rel="next"
    ```

    You can navigate the collection using the pre-generated URLs from the link header or by generating your own URLs using the following query parameters:

    ```
    page: Page number to retrieve
    per_page: Number of items per page (max. 500)
    ```

