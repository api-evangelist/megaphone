    post:
      tags:
      - Episodes
      summary: Create a New Episode
      description: |
        Create a new episode by passing in required fields of information into the request body. By default, ad locations are cleared when new audio (submitted through `mediaFileUrl`) finishes processing. To retain ad locations when new audio finishes processing, use the flag `retainAdLocations`.

        Megaphone's supported audio file formats are MP3 and M4A.

        # Video

        Video users may upload MP3, M4A, MP4, and MOV files via the `mediaFileUrl` field. MP4 and MOV files will be processed and published as videos.

        Please note that if your episode has a video file that is uploaded to a podcast that is missing a required video field (`ownerName`, `ownerEmail`, and `imageFile`), then it will be processed and published as an audio file.

        Video users may also upload thumbnails to their episodes via the `backgroundThumbnailFileUrl` field. These are intended to be used as preview images for the video before it is played in our player.

        For more information, please visit your organization's FAQ page in the which can be found at `https://cms.megaphone.fm/organizations/<organizationId>/video-faq`
      operationId: createANewEpisode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                subtitle:
                  type: string
                summary:
                  type: string
                pubdate:
                  type: string
                  format: date-time
                author:
                  type: string
                backgroundImageFileUrl:
                  type: string
                  format: uri
                mediaFileUrl:
                  type: string
                  format: uri
                retainAdLocations:
                  type: boolean
            example:
              title: News for the week of June 1, 2016
              subtitle: The episode about squirrels
              summary: <p>Our hosts talk about small suburban mammals.</p>
              pubdate: '2016-06-01T14:54:02.690Z'
              author: Bob Smith
              backgroundImageFileUrl: http://example.com/path/to/image
              mediaFileUrl: http://example.com/path/to/file
              retainAdLocations: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: *id001
              example: *id002
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '422':
          $ref: '#/components/responses/422'
      parameters:
