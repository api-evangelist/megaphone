- name: Targeting
  description: |
    # Targeting

    Megaphone provides a top-level endpoint for order targeting objects, including Device Targets, IAB Advertiser Categories, MTM Categories, Nielsen Segments, and Geotargeting (Countries, Regions, and US DMAs) in our database.
- name: Advertiser Categories
  description: |
    Megaphone provides an endpoint for listing Advertiser Categories for Advertiser/Podcast
    association.
- name: IAB Advertiser Categories
  description: |
    Megaphone provides an endpoint for listing IAB Advertiser Categories used for Advertiser/Podcast
    association.
- name: Organization Tags
  description: Megaphone provides an endpoint for listing Organization Tags.
- name: Search Endpoints
  description: |
    # Search

    Megaphone provides a top-level search endpoint for various objects in our database. By default, these endpoints will return every instance of the object accessible to the requesting user. Adding query params to the url will scope the response but an array will always be returned.

    **Note:** For all search endpoints, the `filterMax` parameter may be passed with or without a time value. When there is no time value or when the time value is 0 (e.g. `2022-04-15` or `2022-04-15T00:00:00.0Z`), `filterMax` will be rounded up to the end of the day, such that all values from that day are included.
- name: Direct Sales API v2
  description: |
    **⚠️ AVAILABILITY ⚠️**

    The Direct Sales API v2 provides enhanced endpoints for managing advertisers, campaigns, orders, assets, and advertisements for Standard and Priority campaign types.

    **Base URL:** `https://cms.megaphone.fm/api/v2`

    **Available From:** April 15, 2026 10:00:00 AM EST

    **Migration Timeline:**

    - **Before April 15, 2026:** v2 endpoints not yet available - use legacy endpoints

    - **April 15 - July 14, 2026:** Both legacy and v2 endpoints work - migration period

    - **After July 14, 2026:** Legacy endpoints removed

    **Pagination Note (v2 Direct Sales)**

    Paginated v2 list endpoints (advertisers, campaigns, orders, advertisements, assets, and geo targeting) cap `per_page` at **50** (not 500 as stated in the global section) and follow the global pagination convention (see the Pagination section above) with two additional exceptions:

    - `X-Total` is **not** returned.

    - The `Link` header does **not** include a `last` rel.

    `X-Page`, `X-Per-Page`, and `Link` (`first`, `next`, `previous`) are returned as documented.

    Episode Topics and Audience Interests return all records in a single response and do not support pagination.
- name: Promo API v2
  description: |
    **⚠️ AVAILABILITY ⚠️**

    The Promo API v2 provides endpoints for managing promos, promo advertisements, and promo assets.

    - **Base URL:**`https://cms.megaphone.fm/api/v2`

    - **Available From:** May 15, 2026 00:00:00 UTC

    #### Migration Timeline

    - **Before May 15, 2026:** v2 promo endpoints not yet available; use legacy endpoints.

    - **May 15 - July 14, 2026:** Legacy endpoints and v2 promo endpoints work during the migration period.

    - **After July 14, 2026 11:59:59 UTC:** Legacy promo endpoints are removed.

    #### Key Differences from Orders API v2

    - `promotedPodcastId` is a promo-level field and must be a Megaphone podcast UUID from the requested organization when provided.

    - Promo content targeting accepts Megaphone UUIDs under `shows` and `episodes`.

    - `includeAudienceTargets` & `topics` are not supported for promos.

    - Order-specific fields such as `impressionsCap`, `pacingType`, `cpmRate`, `adHash`, `copy`, and `dcmLineItemId` do not exist on promos.

    - DELETE is not supported. Archive a Promo, Promo Advertisement, or Promo Asset with `PATCH` and `status: "archived"`.
- name: Sponsorships
  description: |
    **⚠️ AVAILABILITY NOTICE ⚠️**

    These Sponsorship API endpoints will be available starting in late April.

    The Sponsorship API provides endpoints for managing sponsorships and sponsors, and for viewing bookable cuepoints for podcast episodes.

    **Base URL:** `https://cms.megaphone.fm/api/v2`

    ## Overview

    **Standard Sponsorships**: Media file inserted. Can target multiple locations.

    **Embedded Sponsorships**: Content already baked into episode audio. Created via [Create Embedded Sponsorship](#embedded-sponsorships-collection-create-an-embedded-sponsorship).

    **Ending a Sponsorship**: Set `endDate` or `status: "archived"` via Update. For embedded sponsorships, this stitches content out and frees the cuepoint. Deleting the embedded cuepoint puts the sponsorship in `inactive` status and the original content plays, but analytics will not be tracked.

    **Note:** Existing Megaphone baked-in annotations will become Embedded Sponsorships without retroactive analytics.
- name: Building Your Own Player
  description: |
    # IAB Compliant Guidelines

    Megaphone's embeddable player is fully compliant with IAB guidelines, however if you choose to create a custom player for your third party site, you must adhere to the following guidelines in order to be IAB compliant:

    1. **No Autoplay**: HTML5 allows you to add an 'autoplay' attribute that, when set to true, plays audio immediately when a page that contains your player is loaded. Due to the inflation of listener counts, IAB guidelines require that this attribute be set to false.

    2. **No Preloading**: HTML5 allows you to add a 'preload' attribute that, when set to true, forces your player to preload content and trigger inflated downloads. IAB guidelines require that this attribute be set to false to avoid artificially inflated numbers.

    3. **Employ an “automatic download unsubscribe” behavior**: For example, after a number of inactive downloads (episodes never played), stop auto downloading additional episodes.

    4. **Do not automatically download all episodes (e.g. back catalog episodes) by default**: This behavior creates unnecessary drain on the publishers’ servers as well as consuming listeners’ bandwidth. It also creates a spike in downloads on server logs that require resources for troubleshooting the spike, explaining it, and addressing it.

    5. **Use header information**: Use header information at the start of the podcast episode to prevent full download when not needed.

    6. **File request**: For a full download, ask for the entire file in one go. For a progressive download, ask for the file in slices (byte range). This way a full download can be distinguished from a progressive download.

    7. **Do not modify enclosure URL**: Do not modify the enclosure URL when requesting media, don’t add extra parameters.

    8. **Do not cache files**: Do not cache podcast episodes on your servers. Always download the latest episode from the enclosure URL for every listener request.

    9. **Use the GUID**: Use the item GUID (as opposed to episode URL, title, publication date, or other data) to identify new episodes in the RSS feed that should be automatically downloaded to a user’s device.  The GUID is designed to be persistent through changes to hosting environment, titles, etc.
- name: Data Exports
  description: |
    # Metric and Impression Export Services

    The Metrics/Impressions Export Service is a daily scheduled Cron job that is configured to export all podcast download logs to customers' Amazon S3 Bucket via JSON files that conform to IABv2 specifications.

    More information on that service is available in our help docs at [http://support.megaphone.fm/en/articles/2678649-metrics-export-service](http://support.megaphone.fm/en/articles/2678649-metrics-export-service) and [http://support.megaphone.fm/en/articles/3706391-impressions-export-service](http://support.megaphone.fm/en/articles/3706391-impressions-export-service).

    Please reach out to our support team for assistance in getting this service setup for your organization.
