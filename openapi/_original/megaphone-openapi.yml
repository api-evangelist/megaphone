  /api/v2/organizations/{organization_id}/bookable-sponsorship-cuepoints:
    get:
      tags:
      - Sponsorships
      summary: Get Bookable Sponsorship Cuepoints
      description: |
        Returns cuepoints that are available for sponsorship targeting, given a show URI and date range. This endpoint considers existing sponsorship rules:

        - Only 2 sponsorships per episode at a given time

        - Cuepoints cannot have multiple sponsorships for the same date range
      operationId: getBookableSponsorshipCuepoints
      parameters:
      - name: show_uri
        in: query
        required: true
        schema:
          type: string
        description: Spotify URI of the show
        example: spotify:show:abc123
      - name: start_date
        in: query
        required: true
        schema:
          type: string
        description: Start date for availability check
        example: '2026-05-01'
      - name: end_date
        in: query
        required: false
        schema:
          type: string
        description: End date for availability check
        example: '2026-06-30'
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the Organization in the form of a UUID
        example: 3ea516ea-a2d1-11e6-8e62-83147939747c
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    episodeUri:
                      type: string
                    episodeName:
                      type: string
                    episodePublishDate:
                      type: string
                      format: date-time
                    cuepoints:
                      type: array
                      items:
                        type: object
                        properties:
                          cuepointId:
                            type: string
                            format: uuid
              example:
              - episodeUri: spotify:episode:xyz789
                episodeName: 'Episode 42: The Big Interview'
                episodePublishDate: '2026-04-15T09:00:00.000Z'
                cuepoints:
                - cuepointId: fb748be0-373d-11ee-a14a-a3c35c166f0f
                - cuepointId: cd234ef5-678a-90bc-d123-e4f5a6b7c8d9
              - episodeUri: spotify:episode:xyz790
                episodeName: 'Episode 43: Behind the Scenes'
                episodePublishDate: '2026-04-22T09:00:00.000Z'
                cuepoints:
                - cuepointId: ef345gh6-789b-01cd-e234-f5a6b7c8d9e0
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '404':
          $ref: '#/components/responses/404'
components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: Authorization
      description: A Megaphone API token, sent as `Token token="<your-token>"`.
    ServiceAuthJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Spotify service-auth JWT. Internal callers only.
  schemas:
    OrderSchedule:
      type: object
      properties:
        startAt:
          type: string
          example: '2026-03-01T00:00:00'
          description: Order start date in ISO8601 without offset
        endAt:
          type: string
          example: '2026-03-31T23:59:59'
          description: Order end date in ISO8601 without offset
        flightTimezone:
          type: string
          example: America/New_York
          description: Timezone identifier (IANA format)
      required:
      - endAt
      - flightTimezone
      - startAt
    GeotargetInclusions:
      type: object
      properties:
        countryCode:
          type: string
          example: US
          description: ISO 3166-1 alpha-2 country code
        dmaIds:
          type: array
          items:
            type: string
            example: '501'
          description: Geoname DMA IDs (US only). Max 1000 across all types
        regionIds:
          type: array
          items:
            type: string
            example: '5128581'
          description: Geoname region IDs. Max 1000 across all types
        postalCodeIds:
          type: array
          items:
            type: string
            example: US:73170
          description: Postal code IDs in format COUNTRY:CODE. Max 1000 across all types
        cityIds:
          type: array
          items:
            type: string
            example: '5128581'
          description: City geoname IDs. Max 1000 across all types
    GeotargetExclusions:
      type: object
      properties:
        dmaIds:
          type: array
          items:
            type: string
            example: '501'
          description: Geoname DMA IDs (US only). Max 1000 across all types
        regionIds:
          type: array
          items:
            type: string
            example: '5128581'
          description: Geoname region IDs. Max 1000 across all types
        postalCodeIds:
          type: array
          items:
            type: string
            example: US:73170
          description: Postal code IDs in format COUNTRY:CODE. Max 1000 across all types
        cityIds:
          type: array
          items:
            type: string
            example: '5128581'
          description: City geoname IDs. Max 1000 across all types
    ContentTargets:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
            example: tag-uuid-1
          description: Organization Tag UUIDs. Max 200
        shows:
          type: array
          items:
            type: string
            example: show-uuid-1
          description: Show/Podcast UUIDs. Max 200
        episodes:
          type: array
          items:
            type: string
            example: episode-uuid-1
          description: Episode UUIDs. Max 200
        topics:
          type: array
          items:
            type: string
            example: books-and-literature
          description: Episode topic IDs. Max 200. Requires Spotify enablement
    AudienceTargets:
      type: object
      properties:
        ageGroups:
          type: array
          items:
            $ref: '#/components/schemas/AgeRange'
          description: Age range targeting
        gender:
          type: string
          enum:
          - all
          - men
          - women
          description: Gender targeting
        audienceInterests:
          type: array
          items:
            type: string
            example: interest-123
          description: Audience interest IDs
    AgeRange:
      type: object
      properties:
        min:
          type: number
          example: 25
          description: Minimum age (21, 25, 35, 45, 55, or 65)
        max:
          type: number
          example: 34
          description: Maximum age (24, 34, 44, 54, 64, or 99)
      required:
      - max
      - min
    Copy:
      type: object
      properties:
        notes:
          type: string
          example: Use upbeat tone
          description: Notes about the order
        promoCode:
          type: string
          example: SAVE20
          description: Promotional code
        vanityUrl:
          type: string
          example: https://example.com/promo
          description: Vanity URL
    FrequencyCap:
      type: object
      properties:
        frequencyUnit:
          type: string
          enum:
          - day
          - week
          - month
          description: Frequency unit
        frequencyPeriod:
          type: number
          example: 7
          description: Number of units in a period (Day ≤31, Week ≤10, Month ≤50)
        maxImpressions:
          type: number
          example: 5
          description: Maximum impressions per user in the period
      required:
      - frequencyPeriod
      - frequencyUnit
      - maxImpressions
    OrderLegacyFields:
      type: object
      properties:
        targetedSegments:
          type: string
          example: A18-34
          description: Nielsen segments targeted
        priority:
          type: number
          example: 1
          description: Priority value
        impressionsGoal:
          type: number
          example: 100000
          description: Impressions goal for the order
        impressions:
          type: number
          example: 50000
          description: Impressions delivered
        revenueCurrency:
          type: string
          example: USD
          description: Currency code on the order
        trackingUrls:
          type: array
          items:
            type: string
            example: https://tracking.example.com
          description: Tracking URLs on the order
        audioStatus:
          type: string
          example: ready
          description: Audio processing status
    AdLegacyFields:
      type: object
      properties:
        podcastInclusions:
          type: array
          items:
            type: string
            example: show-id-1
          description: Included Podcast IDs
        podcastExclusions:
          type: array
          items:
            type: string
            example: show-id-3
          description: Excluded Podcast IDs
        episodeInclusions:
          type: array
          items:
            type: string
            example: episode-id-1
          description: Included episode IDs
        episodeExclusions:
          type: array
          items:
            type: string
            example: episode-id-2
          description: Excluded episode IDs
        geotargetingInclusions:
          type: array
          items:
            type: string
            example: '6252001'
          description: Geotarget inclusion geoname IDs
        geotargetingExclusions:
          type: array
          items:
            type: string
            example: '5332921'
          description: Geotarget exclusion geoname IDs
        daySlots:
          type: array
          items:
            $ref: '#/components/schemas/DaySlot'
          description: Day/time targeting slots
        targetedSegments:
          type: string
          example: A25-34
          description: Nielsen segments
    DaySlot:
      type: object
      properties:
        day:
          type: string
          example: Monday
          description: Day name (Monday, Tuesday, etc.)
        startTime:
          type: string
          example: 09:00
          description: Local time in HH:MM format
        endTime:
          type: string
          example: '17:00'
          description: Local time in HH:MM format
      required:
      - day
      - endTime
      - startTime
    AdSchedule:
      type: object
      properties:
        startAt:
          type: string
          example: '2026-03-08T03:00:00'
          description: Start date in ISO8601 without offset. Date follows order's timezone
        endAt:
          type: string
          example: '2026-03-25T18:30:00'
          description: End date in ISO8601 without offset. Date follows order's timezone
      required:
      - endAt
      - startAt
    ClickableAd:
      type: object
      properties:
        title:
          type: string
          example: Brand Name
          description: Brand name displayed
        tagline:
          type: string
          example: Save 20% today
          description: Tagline to give listeners more context
        clickthroughUrl:
          type: string
          example: https://example.com/landing
          description: The link to the ad's desired landing page
        assetId:
          type: string
          example: image-asset-123
          description: Unique identifier for the image asset
      required:
      - assetId
      - clickthroughUrl
      - tagline
      - title
    Geotargets:
      type: object
      properties:
        countryCode:
          type: string
          example: US
          description: Country code. Supported for inclusions only.
        regionIds:
          type: array
          items:
            type: string
          description: Region IDs
        cityIds:
          type: array
          items:
            type: string
          description: City IDs
        dmaIds:
          type: array
          items:
            type: string
          description: DMA IDs
        postalCodeIds:
          type: array
          items:
            type: string
          description: Postal code IDs
    PromoSchedule:
      type: object
      properties:
        startAt:
          type: string
          example: '2026-08-15T00:00:00'
          description: Start date/time
        endAt:
          type: string
          example: '2026-09-15T23:59:59'
          description: End date/time
        timezone:
          type: string
          example: America/New_York
          description: Timezone name
  responses:
    '401':
      description: Authentication failed. The `Authorization` header is missing or the token is invalid.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: string
                example:
                - Access denied
    '403':
      description: The token's organization does not have API access, or the user lacks permission for this resource.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: string
                example:
                - Forbidden
    '404':
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: string
                example:
                - Not found
    '422':
      description: Validation failed. The request body contains invalid or missing fields.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
                example:
                  title:
                  - can't be blank
    '429':
      description: Rate limit exceeded. The API is limited to 60 requests per minute.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: string
                example:
                - Rate limit exceeded
