    post:
      tags:
      - Sponsorships
      summary: Create a Sponsorship
      description: |
        Create a new sponsorship with targets. Embedded sponsorships must be created via the [Create Embedded Sponsorship](#embedded-sponsorships-collection-create-an-embedded-sponsorship) route.

        **Draft Sponsorships:** Sponsorships can be created as drafts by bassing `status: "draft"`. Draft Sponsorships do not play in the Episode, but their Targets **do** reserve the cuepoint, blocking other Sponsorships.

        **Archived Sponsorships:** Sponsorships cannot be deleted. Use the [Update Sponsorship](#sponsorship-update-a-sponsorship) endpoint with `status: "archived"` to archive a sponsorship (non-reversible).

        You can provide either a `sponsorId` to link to an existing sponsor, or nest a new sponsor object to create one inline.
      operationId: createASponsorship
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the Organization in the form of a UUID
        example: 3ea516ea-a2d1-11e6-8e62-83147939747c
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                showUri:
                  type: string
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
                targets:
                  type: array
                  items:
                    type: object
                    properties:
                      cuepointId:
                        type: string
                        format: uuid
                sponsorId:
                  type: string
                  format: uuid
                advertiserCategory:
                  type: string
                  description: Advertiser category (available through [advertiser categories endpoint](#tag/advertiser-categories/GET/api/targeting/categories))
                  example: ADV-1-8
                videoFile:
                  type: object
                  properties:
                    url:
                      type: string
                      format: uri
                    fileType:
                      type: string
            example:
              name: Q2 Brand Partnership
              showUri: spotify:show:abc123
              startDate: '2026-05-01T00:00:00.000Z'
              endDate: '2026-06-30T23:59:59.000Z'
              targets:
              - cuepointId: fb748be0-373d-11ee-a14a-a3c35c166f0f
              sponsorId: 7a3b9c2d-e4f5-6a7b-8c9d-0e1f2a3b4c5d
              advertiserCategory: ADV-1-8
              videoFile:
                url: https://storage.example.com/sponsorship-video.mp4
                fileType: mp4
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
              example:
                id: spotify:sponsorship:8d4f2b1a-c3e5-4a7b-9f2d-1e6a8b3c5d7f
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '422':
          $ref: '#/components/responses/422'
  /api/v2/organizations/{organization_id}/sponsorships/embedded:
    post:
      tags:
      - Sponsorships
      summary: Create an Embedded Sponsorship
      description: |
        Create an Embedded Sponsorship for content already baked into the episode. This creates 2 entities: an Embedded Sponsorship and the a Cuepoint on the Episode with `action: "replace"`. If the Embedded Sponsorship has an `endDate` or is set to `status: "archived"`, the Episode's content between `startTime` and `endTime` will be **removed** and the cuepoint will be available for new `standard` Sponsorships to target.

        **Validations:**

        - `startTime` must be greater than 30 seconds

        - `endTime` must be greater than `startTime`

        - No `mediaUrl` parameter (content is in the episode)

        - No `targets` parameter (provided `cuepointId` represents the only target)

        **Note on timing fields:** `startTime` and `endTime` are positions *within the episode audio* (offsets in seconds). `endDate` is a *calendar date* on which the sponsorship stops being active.
      operationId: createAnEmbeddedSponsorship
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the Organization in the form of a UUID
        example: 3ea516ea-a2d1-11e6-8e62-83147939747c
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                episodeUri:
                  type: string
                startTime:
                  type: number
                endTime:
                  type: number
                endDate:
                  type: string
                timezone:
                  type: string
                sponsorId:
                  type: string
                  format: uuid
                advertiserCategory:
                  type: string
                  description: Advertiser category (available through [advertiser categories endpoint](#tag/advertiser-categories/GET/api/targeting/categories))
                  example: ADV-1-8
            example:
              name: Mid-Episode Sponsor Mention
              episodeUri: spotify:episode:xyz789
              startTime: 75.0
              endTime: 105.0
              endDate: '2026-06-30'
              timezone: America/New_York
              sponsorId: 7a3b9c2d-e4f5-6a7b-8c9d-0e1f2a3b4c5d
              advertiserCategory: ADV-1-8
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
              example:
                id: spotify:sponsorship:9e5f3c2b-d4e6-5b8c-0a3e-2f7b9c4d6e8f
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '422':
          $ref: '#/components/responses/422'
