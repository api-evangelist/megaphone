    patch:
      tags:
      - Sponsorships
      summary: Update a Sponsorship
      description: |
        Update an existing sponsorship. Only `name`, `endDate`, `targets`, and `advertiserCategory` can be modified.

        **Editable statuses:** `draft`, `scheduled`, `active`, `inactive`
        **Locked statuses:** `completed`, `archived` (cannot be edited)

        To archive, set `status: "archived"` (non-reversible). For embedded sponsorships, archiving stitches content out of the Episode and frees the cuepoint.
      operationId: updateASponsorship
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the Organization in the form of a UUID
        example: 3ea516ea-a2d1-11e6-8e62-83147939747c
      - name: sponsorship_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the Sponsorship in the form of a UUID
        example: 8d4f2b1a-c3e5-4a7b-9f2d-1e6a8b3c5d7f
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                endDate:
                  type: string
                  format: date-time
                advertiserCategory:
                  type: string
                  description: Advertiser category (available through [advertiser categories endpoint](#tag/advertiser-categories/GET/api/targeting/categories))
                  example: ADV-1-8
            example:
              name: Q2 Brand Partnership - Updated
              advertiserCategory: ADV-1-8
              endDate: '2026-07-31T23:59:59.000Z'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  startDate:
                    type: string
                    format: date-time
                  endDate:
                    type: string
                    format: date-time
                  type:
                    type: string
                  status:
                    type: string
                  duration:
                    type: integer
                  mediaUrl:
                    type: string
                    format: uri
                  showUri:
                    type: string
                  sponsorId:
                    type: string
                    format: uuid
                  advertiserCategory:
                    type: string
                    description: Advertiser category (available through [advertiser categories endpoint](#tag/advertiser-categories/GET/api/targeting/categories))
                    example: ADV-1-8
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
              example:
                id: 8d4f2b1a-c3e5-4a7b-9f2d-1e6a8b3c5d7f
                name: Q2 Brand Partnership - Updated
                startDate: '2026-05-01T00:00:00.000Z'
                endDate: '2026-07-31T23:59:59.000Z'
                type: standard
                status: active
                duration: 30
                mediaUrl: https://storage.example.com/sponsorship.mp3
                showUri: spotify:show:abc123
                sponsorId: 7a3b9c2d-e4f5-6a7b-8c9d-0e1f2a3b4c5d
                advertiserCategory: ADV-1-8
                createdAt: '2026-04-22T10:30:00.000Z'
                updatedAt: '2026-04-25T14:30:00.000Z'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: Sponsorship cannot be edited in 'completed' status
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '404':
          $ref: '#/components/responses/404'
