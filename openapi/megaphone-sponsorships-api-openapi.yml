  /api/v2/organizations/{organization_id}/bookable-sponsorship-cuepoints:
    get:
      tags:
      - Sponsorships
      summary: Get Bookable Sponsorship Cuepoints
      description: 'Returns cuepoints that are available for sponsorship targeting, given a show URI and date range. This endpoint considers existing sponsorship rules:


        - Only 2 sponsorships per episode at a given time


        - Cuepoints cannot have multiple sponsorships for the same date range'
      operationId: getBookableSponsorshipCuepoints
      parameters:
      - name: show_uri
        in: query
        required: true
        schema:
          type: string
        description: Spotify URI of the show
        example: spotify:show:abc123
      - name: start_date
        in: query
        required: true
        schema:
          type: string
        description: Start date for availability check
        example: '2026-05-01'
      - name: end_date
        in: query
        required: false
        schema:
          type: string
        description: End date for availability check
        example: '2026-06-30'
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the Organization in the form of a UUID
        example: 3ea516ea-a2d1-11e6-8e62-83147939747c
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    episodeUri:
                      type: string
                    episodeName:
                      type: string
                    episodePublishDate:
                      type: string
                      format: date-time
                    cuepoints:
                      type: array
                      items:
                        type: object
                        properties:
                          cuepointId:
                            type: string
                            format: uuid
              example:
              - episodeUri: spotify:episode:xyz789
                episodeName: 'Episode 42: The Big Interview'
                episodePublishDate: '2026-04-15T09:00:00.000Z'
                cuepoints:
                - cuepointId: fb748be0-373d-11ee-a14a-a3c35c166f0f
                - cuepointId: cd234ef5-678a-90bc-d123-e4f5a6b7c8d9
              - episodeUri: spotify:episode:xyz790
                episodeName: 'Episode 43: Behind the Scenes'
                episodePublishDate: '2026-04-22T09:00:00.000Z'
                cuepoints:
                - cuepointId: ef345gh6-789b-01cd-e234-f5a6b7c8d9e0
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '404':
          $ref: '#/components/responses/404'
components:
  responses:
    '403':
      description: The token's organization does not have API access, or the user lacks permission for this resource.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: string
                example:
                - Forbidden
    '401':
      description: Authentication failed. The `Authorization` header is missing or the token is invalid.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: string
                example:
                - Access denied
    '429':
      description: Rate limit exceeded. The API is limited to 60 requests per minute.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: string
                example:
                - Rate limit exceeded
    '404':
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: string
                example:
                - Not found
    '422':
      description: Validation failed. The request body contains invalid or missing fields.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
                example:
                  title:
                  - can't be blank
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: Authorization
      description: A Megaphone API token, sent as `Token token="<your-token>"`.
    ServiceAuthJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Spotify service-auth JWT. Internal callers only.
