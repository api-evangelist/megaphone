openapi: 3.2.0
info:
  title: Megaphone Promo API v2 API
  version: 1.0.0
  description: 'The Megaphone API (https://cms.megaphone.fm/api) allows podcast producers and partners to view, create, update, and delete podcasts and episodes. Note that the Megaphone API is rate limited at 60 requests per minute (1 request per second). ## Direct Sales API Breaking Change Notice


    ⚠️ **IMPORTANT** ⚠️


    The legacy Direct Sales endpoints for Advertisers, Campaigns, Orders, Advertisements and Geos are being replaced with new v2 endpoints with enhanced functionality. ### Timeline


    **Phase 1: Before April 15, 2026**


    - Only legacy endpoints are available


    - Continue using existing Direct Sales API endpoints


    **Phase 2: April 15, 2026 10:00:00 AM EST - July 14, 2026 11:59:59 UTC (Migration Period)**


    - **v2 endpoints become available**


    - Legacy endpoints continue to work during this period


    - Both legacy and v2 endpoints are operational


    - **We strongly encourage you to start testing and migrating to v2 endpoints as soon as they become available to ensure a smooth transition before the sunset date and to continue ad delivery without disruption.**


    **Phase 3: After July 14, 2026 11:59:59 UTC**


    - Legacy endpoints are **removed and will stop working**


    - Only v2 endpoints will be supported


    - [Old] Standard campaigns can use v2 GET endpoints


    ### What''s Changing


    **API Version:** v2 REST API for managing advertisers, campaigns, orders, assets, advertisements, and targeting. **Effective Date:** New endpoints (v2) will be effective on **April 15, 2026 10:00:00 AM EST**


    **Sunset Date:** Legacy endpoints stop for [Old] Standard on **July 14, 2026 11:59:59 UTC**


    ##### Capability Matrix


    API endpoint availability by resource, campaign type, and version


    | Resource | Campaign Type | GET (v2) | POST / PATCH (v2) | DELETE (v2) | Legacy POST / PUT / GET / DELETE |

    | ------------------ | ------------------- | :------: | :---------------: | :---------: | :------------------------------: |

    | Advertisers | N/A | ✅ | ✅ | ✅ | ✅ |

    | Campaigns | Standard / Priority | ✅ | ✅ (Archive)† | ❌ | ❌ |

    | Campaigns | [Old] Standard* | ✅ | ❌ | ❌ | ✅ |

    | Orders | Standard / Priority | ✅ | ✅ (Archive)† | ❌ | ❌ |

    | Orders | [Old] Standard | ✅ | ❌ | ❌ | ✅ |

    | Advertisements | Standard / Priority | ✅ | ✅ (Archive)† | ❌ | ❌ |

    | Advertisements | [Old] Standard | ✅ | ❌ | ❌ | ✅ |

    | Assets** | Standard / Priority | ✅ | ✅ | ❌ | ❌ |

    | Geo Targeting*** | Standard / Priority | ✅ | N/A | N/A | ❌ |

    | Episode Topics | Standard / Priority | ✅ | N/A | N/A | ❌ |

    | Audience Interests | Standard / Priority | ✅ | N/A | N/A | ❌ |


    *"[Old] Standard" refers to campaigns that will end after the sunset date


    **Assets to be used for Standard/Priority campaigns


    ***Geo Targeting includes Countries, Regions, DMAs, Cities, and Postal Codes lookup endpoints. Not applicable to [Old] Standard campaigns. [Old] Standard campaign orders can continue to use the legacy geo endpoints below. †v2 uses PATCH with `status: "archived"` instead of DELETE for Campaigns, Orders, and Advertisements. See migration guide for details.'
  contact:
    name: Megaphone Support
    url: https://support.megaphone.fm/
servers:
- url: https://cms.megaphone.fm
  description: Production
security:
- ApiToken: []
tags:
- name: Promo API v2
  description: '**⚠️ AVAILABILITY ⚠️**


    The Promo API v2 provides endpoints for managing promos, promo advertisements, and promo assets.


    - **Base URL:**`https://cms.megaphone.fm/api/v2`


    - **Available From:** May 15, 2026 00:00:00 UTC


    #### Migration Timeline


    - **Before May 15, 2026:** v2 promo endpoints not yet available; use legacy endpoints.


    - **May 15 - July 14, 2026:** Legacy endpoints and v2 promo endpoints work during the migration period.


    - **After July 14, 2026 11:59:59 UTC:** Legacy promo endpoints are removed.


    #### Key Differences from Orders API v2


    - `promotedPodcastId` is a promo-level field and must be a Megaphone podcast UUID from the requested organization when provided.


    - Promo content targeting accepts Megaphone UUIDs under `shows` and `episodes`.


    - `includeAudienceTargets` & `topics` are not supported for promos.


    - Order-specific fields such as `impressionsCap`, `pacingType`, `cpmRate`, `adHash`, `copy`, and `dcmLineItemId` do not exist on promos.


    - DELETE is not supported. Archive a Promo, Promo Advertisement, or Promo Asset with `PATCH` and `status: "archived"`.'
paths:
  /api/v2/organizations/{organization_id}/promos:
    get:
      tags:
      - Promo API v2
      summary: List All Promos
      description: List all promos for an organization.
      operationId: listAllPromos
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
        description: 'Page number to retrieve (default: 1)'
        example: '1'
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
        description: 'Number of items per page (default: 50, max: 50)'
        example: '50'
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the Organization in the form of a UUID
        example: 3ea516ea-a2d1-11e6-8e62-83147939747c
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    promotedPodcastId:
                      type: string
                      format: uuid
                    assetFormat:
                      type: string
                    state:
                      type: string
                    schedule:
                      type: object
                      properties:
                        startAt:
                          type: string
                          format: date-time
                        endAt:
                          type: string
                          format: date-time
                        timezone:
                          type: string
                    includeContentTargets:
                      type: object
                      properties:
                        shows:
                          type: array
                          items:
                            type: string
                    excludeContentTargets:
                      type: object
                      properties:
                        episodes:
                          type: array
                          items:
                            type: string
                    includeGeotargets:
                      type: object
                      properties:
                        regionIds:
                          type: array
                          items:
                            type: string
                        cityIds:
                          type: array
                          items:
                            type: string
                    excludeGeotargets:
                      type: object
                      properties:
                        dmaIds:
                          type: array
                          items:
                            type: string
                        postalCodeIds:
                          type: array
                          items:
                            type: string
                    includeDeviceTargets:
                      type: array
                      items:
                        type: string
                    frequencyCaps:
                      type: array
                      items:
                        type: object
                        properties:
                          frequencyUnit:
                            type: string
                          frequencyPeriod:
                            type: integer
                          maxImpressions:
                            type: integer
                    status:
                      type: string
                    createdAt:
                      type: string
                      format: date-time
                    updatedAt:
                      type: string
                      format: date-time
                    createdBy:
                      type: string
                    updatedBy:
                      type: string
              example:
              - id: ee2d5bb6-a526-11e6-9164-e3c1235770c1
                name: True Crime Weekly Cross-Promo
                promotedPodcastId: 0f64b2de-a4b4-4f63-8d5d-7d7c4bb2a111
                assetFormat: audio
                state: 'on'
                schedule:
                  startAt: '2026-08-15T00:00:00'
                  endAt: '2026-09-15T23:59:59'
                  timezone: America/New_York
                includeContentTargets:
                  shows:
                  - podcast-uuid-1
                excludeContentTargets:
                  episodes:
                  - episode-uuid-1
                includeGeotargets:
                  regionIds:
                  - '5128581'
                  cityIds:
                  - '4930956'
                excludeGeotargets:
                  dmaIds:
                  - '501'
                  postalCodeIds:
                  - US:10001
                includeDeviceTargets:
                - ios
                - android
                frequencyCaps:
                - frequencyUnit: day
                  frequencyPeriod: 1
                  maxImpressions: 5
                status: active
                createdAt: '2026-01-15T10:30:00.000Z'
                updatedAt: '2026-01-15T10:30:00.000Z'
                createdBy: user-uuid-abc
                updatedBy: user-uuid-abc
