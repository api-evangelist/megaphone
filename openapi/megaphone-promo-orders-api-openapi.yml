        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    createdAt:
                      type: string
                      format: date-time
                    updatedAt:
                      type: string
                      format: date-time
                    title: {}
                    region:
                      type: string
                    scheduledAt:
                      type: string
                      format: date-time
                    impressionsCap:
                      type: integer
                    organizationId:
                      type: string
                      format: uuid
                    startAt: {}
                    endAt: {}
                    adhash: {}
                    priority:
                      type: integer
                    position:
                      type: integer
                    impressionsGoal: {}
                    revenueCents: {}
                    revenueCurrency:
                      type: string
                    notes: {}
                    flightTimezone: {}
                    geotargets:
                      type: array
                      items:
                        type: string
                    geoexclusions:
                      type: array
                      items: {}
                    geonameIdInclusions:
                      type: array
                      items:
                        type: string
                    geonameIdExclusions:
                      type: array
                      items: {}
                    state:
                      type: string
                    audioStatus:
                      type: string
                    copyNeeded:
                      type: boolean
                    promoCode: {}
                    vanityUrl: {}
                    targets:
                      type: array
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                          id:
                            type: string
                            format: uuid
                    promo:
                      type: boolean
              example:
              - id: ee2d5bb6-a526-11e6-9164-e3c1235770c1
                createdAt: '2016-11-07T20:15:30.465Z'
                updatedAt: '2016-11-07T20:15:30.465Z'
