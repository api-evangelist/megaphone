  /api/organizations/{organization_id}/campaigns/{campaign_id}/orders/{order_id}/advertisements:
    get:
      tags:
      - Advertisements
      summary: List All Campaign Order Advertisements
      description: Returns metadata about all the campaign order advertisements you are authorized to access in the Megaphone platform.
      operationId: listAllCampaignOrderAdvertisements
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the Organization in the form of a UUID
        example: 731851fc-9fad-11e6-a338-072240a555ac
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the Campaign in the form of a UUID
        example: 4ba157f0-a506-11e6-9164-437b083548dd
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the Order in the form of the a UUID
        example: bdcad5bc-a6b5-11e6-b1f6-5b0e62100551
      - name: updated_since
        in: query
        required: false
        schema:
          type: string
        description: 'Optional query param that will scope the response to only podcasts that have

          been updated since the Date and Time that is provided.

          '
        example: 2019-11-22T19:44:09+0000
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    audioFile:
                      type: string
                      format: uri
                    audioFileProcessing:
                      type: boolean
                    audioFileDuration:
                      type: string
                    insertionPoint:
                      type: string
                    position:
                      type: integer
                    createdAt:
                      type: string
                      format: date-time
                    updatedAt:
                      type: string
                      format: date-time
                    originalFilename:
                      type: string
                    orderId:
                      type: string
                      format: uuid
                    audioFileStatus:
                      type: string
                    weight:
                      type: integer
                    state:
                      type: string
                    displayName:
                      type: string
                    trackingUrls:
                      type: array
                      items:
                        type: string
                    inclusions:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          type:
                            type: string
                    exclusions:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          type:
                            type: string
                    geonameIdInclusions:
                      type: array
                      items:
                        type: string
                    geonameIdExclusions:
                      type: array
                      items:
                        type: string
                    schedule:
                      type: array
                      items:
                        type: object
                        properties:
                          day:
                            type: string
                          startTime:
                            type: string
                          endTime:
                            type: string
              example:
              - id: fd2142fc-a6bd-11e6-b1f6-47960ee0cc34
                audioFile: https://example.com/file.mp3
                audioFileProcessing: false
                audioFileDuration: '2.3'
                insertionPoint: pre
                position: 0
                createdAt: '2016-11-09T20:49:20.721Z'
                updatedAt: '2016-11-09T20:50:02.175Z'
                originalFilename: 2_another-pre-roll.mp3
                orderId: 4937733c-a2d1-11e6-8e62-fbc34511fed7
                audioFileStatus: success
                weight: 1
                state: enabled
                displayName: Example pre roll ad
                trackingUrls:
                - www.trackingurl.com
                inclusions:
                - id: 3fe4881a-a2d1-11e6-8e62-8b11e4f93efb
                  type: episode
                exclusions:
                - id: 3fe4881a-a2d1-11e6-8e62-8b11e4f93efb
                  type: episode
                geonameIdInclusions:
                - '6252001'
                geonameIdExclusions: []
                schedule:
                - day: tuesday
                  startTime: '11:00'
                  endTime: '21:00'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '404':
          $ref: '#/components/responses/404'
