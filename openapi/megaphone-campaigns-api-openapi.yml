openapi: 3.2.0
info:
  title: Megaphone Campaigns API
  version: 1.0.0
  description: 'The Megaphone API (https://cms.megaphone.fm/api) allows podcast producers and partners to view, create, update, and delete podcasts and episodes. Note that the Megaphone API is rate limited at 60 requests per minute (1 request per second). ## Direct Sales API Breaking Change Notice


    ⚠️ **IMPORTANT** ⚠️


    The legacy Direct Sales endpoints for Advertisers, Campaigns, Orders, Advertisements and Geos are being replaced with new v2 endpoints with enhanced functionality. ### Timeline


    **Phase 1: Before April 15, 2026**


    - Only legacy endpoints are available


    - Continue using existing Direct Sales API endpoints


    **Phase 2: April 15, 2026 10:00:00 AM EST - July 14, 2026 11:59:59 UTC (Migration Period)**


    - **v2 endpoints become available**


    - Legacy endpoints continue to work during this period


    - Both legacy and v2 endpoints are operational


    - **We strongly encourage you to start testing and migrating to v2 endpoints as soon as they become available to ensure a smooth transition before the sunset date and to continue ad delivery without disruption.**


    **Phase 3: After July 14, 2026 11:59:59 UTC**


    - Legacy endpoints are **removed and will stop working**


    - Only v2 endpoints will be supported


    - [Old] Standard campaigns can use v2 GET endpoints


    ### What''s Changing


    **API Version:** v2 REST API for managing advertisers, campaigns, orders, assets, advertisements, and targeting. **Effective Date:** New endpoints (v2) will be effective on **April 15, 2026 10:00:00 AM EST**


    **Sunset Date:** Legacy endpoints stop for [Old] Standard on **July 14, 2026 11:59:59 UTC**


    ##### Capability Matrix


    API endpoint availability by resource, campaign type, and version


    | Resource | Campaign Type | GET (v2) | POST / PATCH (v2) | DELETE (v2) | Legacy POST / PUT / GET / DELETE |

    | ------------------ | ------------------- | :------: | :---------------: | :---------: | :------------------------------: |

    | Advertisers | N/A | ✅ | ✅ | ✅ | ✅ |

    | Campaigns | Standard / Priority | ✅ | ✅ (Archive)† | ❌ | ❌ |

    | Campaigns | [Old] Standard* | ✅ | ❌ | ❌ | ✅ |

    | Orders | Standard / Priority | ✅ | ✅ (Archive)† | ❌ | ❌ |

    | Orders | [Old] Standard | ✅ | ❌ | ❌ | ✅ |

    | Advertisements | Standard / Priority | ✅ | ✅ (Archive)† | ❌ | ❌ |

    | Advertisements | [Old] Standard | ✅ | ❌ | ❌ | ✅ |

    | Assets** | Standard / Priority | ✅ | ✅ | ❌ | ❌ |

    | Geo Targeting*** | Standard / Priority | ✅ | N/A | N/A | ❌ |

    | Episode Topics | Standard / Priority | ✅ | N/A | N/A | ❌ |

    | Audience Interests | Standard / Priority | ✅ | N/A | N/A | ❌ |


    *"[Old] Standard" refers to campaigns that will end after the sunset date


    **Assets to be used for Standard/Priority campaigns


    ***Geo Targeting includes Countries, Regions, DMAs, Cities, and Postal Codes lookup endpoints. Not applicable to [Old] Standard campaigns. [Old] Standard campaign orders can continue to use the legacy geo endpoints below. †v2 uses PATCH with `status: "archived"` instead of DELETE for Campaigns, Orders, and Advertisements. See migration guide for details.'
  contact:
    name: Megaphone Support
    url: https://support.megaphone.fm/
servers:
- url: https://cms.megaphone.fm
  description: Production
security:
- ApiToken: []
tags:
- name: Campaigns
  description: '**⚠️ BREAKING CHANGE NOTICE ⚠️**


    These legacy endpoints will continue to work until **July 14, 2026 11:59:59 UTC**.

    v2 endpoints become available on **April 15, 2026**.

    Please migrate to the v2 Campaigns API before the sunset date.'
paths:
  /api/organizations/{organization_id}/campaigns:
    get:
      tags:
      - Campaigns
      summary: List All Campaigns
      description: Returns information about all the campaigns that you have permission to view within Megaphone.
      operationId: listAllCampaigns
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the Organization in the form of a UUID
        example: 731851fc-9fad-11e6-a338-072240a555ac
      - name: updated_since
        in: query
        required: false
        schema:
          type: string
        description: 'Optional query param that will scope the response to only podcasts that have

          been updated since the Date and Time that is provided.

          '
        example: 2019-11-22T19:44:09+0000
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    createdAt:
                      type: string
                      format: date-time
                    updatedAt:
                      type: string
                      format: date-time
                    title:
                      type: string
                    advertiserId:
                      type: string
                      format: uuid
                    totalBudgetCents:
                      type: integer
                    totalBudgetCurrency:
                      type: string
                    totalRevenueCents:
                      type: integer
                    totalRevenueCurrency:
                      type: string
                    durationInSeconds:
                      type: integer
                    advertiser:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        displayName:
                          type: string
                        agency:
                          type: string
                        currency:
                          type: string
              example:
              - id: 4ba157f0-a506-11e6-9164-437b083548dd
                createdAt: '2016-11-07T16:21:53.862Z'
                updatedAt: '2016-11-07T20:13:09.416Z'
                title: Product Campaign
                advertiserId: 491d22de-a2d1-11e6-8e62-975da49f7a68
                totalBudgetCents: 123123
                totalBudgetCurrency: USD
                totalRevenueCents: 123123
                totalRevenueCurrency: USD
                durationInSeconds: 2628000
                advertiser:
                  id: 491d22de-a2d1-11e6-8e62-975da49f7a68
                  name: Advertiser Name
                  displayName: Advertiser Display Name
                  agency: Agency Name
                  currency: USD
              - id: 66640062-a4ff-11e6-9164-5b7b567e6ad6
                createdAt: '2016-11-07T15:32:32.281Z'
                updatedAt: '2016-11-07T15:32:32.281Z'
                title: Newest campaign
                advertiserId: 491d22de-a2d1-11e6-8e62-975da49f7a68
                totalBudgetCents: 0
                totalBudgetCurrency: USD
                totalRevenueCents: 0
                totalRevenueCurrency: USD
                durationInSeconds: 0
                advertiser:
                  id: 491d22de-a2d1-11e6-8e62-975da49f7a68
                  name: Advertiser Name
                  displayName: Advertiser Display Name
                  agency: Agency Name
                  currency: USD
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '404':
          $ref: '#/components/responses/404'
    post:
      tags:
      - Campaigns
      summary: Create a New Campaign
      description: 'Create a new campaign by submitting the required information within the request body.

        **Note: totalBudgetCurrency must match currency on advertiser, or a new advertiser will be created**'
      operationId: createANewCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                advertiserId:
                  type: string
                  format: uuid
                totalBudgetCents:
                  type: integer
                totalBudgetCurrency:
                  type: string
            example:
              title: New campaign title
              advertiserId: 491d22de-a2d1-11e6-8e62-975da49f7a68
              totalBudgetCents: 12345
              totalBudgetCurrency: USD
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  title:
                    type: string
                  advertiserId:
                    type: string
                    format: uuid
                  totalBudgetCents:
                    type: integer
                  totalBudgetCurrency:
                    type: string
                  totalRevenueCents:
                    type: integer
                  totalRevenueCurrency:
                    type: string
                  durationInSeconds:
                    type: integer
                  advertiser:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      displayName:
                        type: string
                      agency:
                        type: string
                      currency:
                        type: string
              example:
                id: 8d3f0828-a6ab-11e6-b1f6-7f1cbe882371
                createdAt: '2016-11-09T18:37:22.070Z'
                updatedAt: '2016-11-09T18:37:22.070Z'
                title: New campaign title
                advertiserId: 491d22de-a2d1-11e6-8e62-975da49f7a68
                totalBudgetCents: 0
                totalBudgetCurrency: USD
                totalRevenueCents: 0
                totalRevenueCurrency: USD
                durationInSeconds: 0
                advertiser:
                  id: 491d22de-a2d1-11e6-8e62-975da49f7a68
                  name: Advertiser Name
                  displayName: Advertiser Display Name
                  agency: Agency Name
                  currency: USD
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '422':
          $ref: '#/components/responses/422'
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/organizations/{organization_id}/campaigns/{id}:
    get:
      tags:
      - Campaigns
      summary: Show a Campaign
      description: Get metadata about a single campaign.
      operationId: showACampaign
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the Organization in the form of a UUID
        example: 3ea516ea-a2d1-11e6-8e62-83147939747c
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the Campaign in the form of a UUID
        example: 8d3f0828-a6ab-11e6-b1f6-7f1cbe882371
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  title:
                    type: string
                  advertiserId:
                    type: string
                    format: uuid
                  totalBudgetCents:
                    type: integer
                  totalBudgetCurrency:
                    type: string
                  totalRevenueCents:
                    type: integer
                  totalRevenueCurrency:
                    type: string
                  durationInSeconds:
                    type: integer
                  advertiser:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      displayName:
                        type: string
                      agency:
                        type: string
                      currency:
                        type: string
              example:
                id: 8d3f0828-a6ab-11e6-b1f6-7f1cbe882371
                createdAt: '2016-11-09T18:37:22.070Z'
                updatedAt: '2016-11-09T18:37:22.070Z'
                title: New campaign title
                advertiserId: 491d22de-a2d1-11e6-8e62-975da49f7a68
                totalBudgetCents: 0
                totalBudgetCurrency: USD
                totalRevenueCents: 0
                totalRevenueCurrency: USD
                durationInSeconds: 0
                advertiser:
                  id: 491d22de-a2d1-11e6-8e62-975da49f7a68
                  name: Advertiser Name
                  displayName: Advertiser Display Name
                  agency: Agency Name
                  currency: USD
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '404':
          $ref: '#/components/responses/404'
    put:
      tags:
      - Campaigns
      summary: Update a Campaign
      description: 'Update an existing campaign by sending the attributes you wish to update in the request body.

        **Note: totalBudgetCurrency must match currency on advertiser, or a new advertiser will be created**'
      operationId: updateACampaign
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the Organization in the form of a UUID
        example: 3ea516ea-a2d1-11e6-8e62-83147939747c
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the Campaign in the form of a UUID
        example: 8d3f0828-a6ab-11e6-b1f6-7f1cbe882371
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
            example:
              title: Updated campaign title
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  title:
                    type: string
                  advertiserId:
                    type: string
                    format: uuid
                  totalBudgetCents:
                    type: integer
                  totalBudgetCurrency:
                    type: string
                  totalRevenueCents:
                    type: integer
                  totalRevenueCurrency:
                    type: string
                  durationInSeconds:
                    type: integer
                  advertiser:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      displayName:
                        type: string
                      agency:
                        type: string
                      currency:
                        type: string
              example:
                id: 8d3f0828-a6ab-11e6-b1f6-7f1cbe882371
                createdAt: '2016-11-09T18:37:22.070Z'
                updatedAt: '2016-11-09T18:57:25.639Z'
                title: Updated campaign title
                advertiserId: 491d22de-a2d1-11e6-8e62-975da49f7a68
                totalBudgetCents: 0
                totalBudgetCurrency: USD
                totalRevenueCents: 0
                totalRevenueCurrency: USD
                durationInSeconds: 0
                advertiser:
                  id: 491d22de-a2d1-11e6-8e62-975da49f7a68
                  name: Advertiser Name
                  displayName: Advertiser Display Name
                  agency: Agency Name
                  currency: USD
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '422':
          $ref: '#/components/responses/422'
        '404':
          $ref: '#/components/responses/404'
    delete:
      tags:
      - Campaigns
      summary: Delete a Campaign
      description: Remove a campaign from the Megaphone platform.
      operationId: deleteACampaign
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the Organization in the form of a UUID
        example: 3ea516ea-a2d1-11e6-8e62-83147939747c
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the Campaign in the form of a UUID
        example: 8d3f0828-a6ab-11e6-b1f6-7f1cbe882371
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: string
              example:
                success: Campaign with id 8d3f0828-a6ab-11e6-b1f6-7f1cbe882371 successfully destroyed
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '422':
          $ref: '#/components/responses/422'
        '404':
          $ref: '#/components/responses/404'
components:
  responses:
    '403':
      description: The token's organization does not have API access, or the user lacks permission for this resource.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: string
                example:
                - Forbidden
    '401':
      description: Authentication failed. The `Authorization` header is missing or the token is invalid.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: string
                example:
                - Access denied
    '429':
      description: Rate limit exceeded. The API is limited to 60 requests per minute.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: string
                example:
                - Rate limit exceeded
    '404':
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: string
                example:
                - Not found
    '422':
      description: Validation failed. The request body contains invalid or missing fields.
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
                example:
                  title:
                  - can't be blank
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: Authorization
      description: A Megaphone API token, sent as `Token token="<your-token>"`.
    ServiceAuthJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Spotify service-auth JWT. Internal callers only.
